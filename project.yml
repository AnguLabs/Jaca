name: Jaca
options:
  bundleIdPrefix: dev.srsouza
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top

packages:
  Lemonade:
    path: ../lemonade-design-system
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.65.0"
  swift-nio-ssl:
    url: https://github.com/apple/swift-nio-ssl.git
    from: "2.27.0"
  swift-certificates:
    url: https://github.com/apple/swift-certificates.git
    from: "1.5.0"
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.5.0"
  swift-asn1:
    url: https://github.com/apple/swift-asn1.git
    from: "1.2.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    # Ad-hoc local signing so the app runs without a dev account and can spawn
    # adb/xcrun via Process (no App Sandbox).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO

targets:
  Jaca:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
    dependencies:
      - package: Lemonade
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio
        product: NIOHTTP1
      - package: swift-nio
        product: NIOFoundationCompat
      - package: swift-nio-ssl
        product: NIOSSL
      - package: swift-certificates
        product: X509
      - package: swift-crypto
        product: Crypto
      - package: swift-asn1
        product: SwiftASN1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.srsouza.Jaca
        PRODUCT_NAME: Jaca
        # Small Objective-C bridge for physical-device structured logs (LoggingSupport
        # private API). See Sources/Core/Logs/JacaOSLog.{h,m} + investigate-loggingsupport skill.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Jaca-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      # Records where this build came from + which commit it built, so the in-app
      # updater can compare against origin/main and pull/rebuild. Written to a
      # sidecar (not the bundle) so it never invalidates the ad-hoc code signature.
      - name: Write build-info sidecar
        basedOnDependencyAnalysis: false
        script: |
          DIR="$HOME/Library/Application Support/Jaca"
          mkdir -p "$DIR"
          COMMIT=$(cd "$SRCROOT" && git rev-parse HEAD 2>/dev/null || echo "")
          printf '{"repoPath": "%s", "buildCommit": "%s"}\n' "$SRCROOT" "$COMMIT" > "$DIR/build-info.json"

  JacaTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: Jaca
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.srsouza.JacaTests
        GENERATE_INFOPLIST_FILE: YES

  JacaUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: UITests
    dependencies:
      - target: Jaca
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.srsouza.JacaUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Jaca

schemes:
  Jaca:
    build:
      targets:
        Jaca: all
        JacaTests: [test]
        JacaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JacaTests
        - JacaUITests
